[package]
name = "BookLauncher"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.30"
rfd = "0.14"
lopdf = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5"
directories = "5.0"

image = "0.25"
epub = "2.0"
pdf-extract = "0.3"  # Note: This is an older version; consider updating if possible

mobi = "0.7"         # For MOBI/AZW3 support

reqwest = { version = "0.11", features = ["blocking", "json"] }
urlencoding = "2.1"
anyhow = "1.0"       # For error handling

once_cell = "1.19"
lumen = "2.19.0"     # Assuming this is still needed, though not used in updates